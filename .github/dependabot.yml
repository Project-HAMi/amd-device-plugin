version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # the pinned docs build (Read the Docs)
  - package-ecosystem: pip
    directory: /docs/sphinx
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # the memory hook is built from this submodule
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
