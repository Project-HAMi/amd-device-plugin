name: Release Helm Charts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/helm-chart-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      # chart-releaser expects its pages branch to exist. Bootstrap an empty
      # branch on the first release without modifying the checked-out tree.
      - name: Ensure chart repository branch exists
        env:
          CR_PAGES_BRANCH: helm-chart-release
        run: |
          if ! git ls-remote --exit-code --heads origin "${CR_PAGES_BRANCH}" >/dev/null; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            initial_commit="$(printf 'Initialize Helm chart repository\n' | git commit-tree "${empty_tree}")"
            git push origin "${initial_commit}:refs/heads/${CR_PAGES_BRANCH}"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          # The charts directory
          charts_dir: helm
          # The GitHub Pages URL to the charts repo (default: https://<owner>.github.io/<repo>)
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "{{ .Name }}-helm-{{ .Version }}"
          CR_PAGES_BRANCH: "helm-chart-release"
