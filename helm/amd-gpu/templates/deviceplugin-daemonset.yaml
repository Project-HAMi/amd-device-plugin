apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Chart.Name }}-device-plugin-daemonset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amd-gpu.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      name: {{ .Chart.Name }}-dp-ds
  {{- with .Values.dp.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        name: {{ .Chart.Name }}-dp-ds
    spec:
      serviceAccountName: {{ include "amd-gpu.devicePluginServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.node_selector_enabled }}
      {{- with .Values.node_selector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      priorityClassName: system-node-critical
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-dp-cntr
          image: {{ .Values.dp.image.repository }}:{{ .Values.dp.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.dp.image.pullPolicy }}
          command: ["./k8s-device-plugin"]
          args: ["-logtostderr=true", "-stderrthreshold=INFO", "-v={{ .Values.dp.logVerbosity }}", "-pulse={{ .Values.dp.healthPulse }}", "-split_count={{ .Values.dp.splitCount }}", "-allocator_policy={{ .Values.dp.allocatorPolicy }}"{{ if .Values.dp.cdi.enabled }}, "-cdi_spec_dir={{ .Values.dp.cdi.specDir }}"{{ end }}, "-dmem_backend={{ .Values.dp.dmemBackend }}"{{ if .Values.dp.muslFailClosed.enabled }}, "-musl_fail_closed=true", "-ctr_path=/opt/amd-gpu-ctr-host/ctr", "-containerd_socket={{ .Values.dp.muslFailClosed.containerdSocket }}"{{ end }}]
          {{- if .Values.dp.hookInstaller.enabled }}
          # Temporary HAMi-style delivery: copy the image-bundled hook into
          # the hostPath after the device-plugin container is created.
          lifecycle:
            postStart:
              exec:
                command:
                  - /opt/hami/bin/amd-vgpu-init.sh
                  - {{ printf "%s/vgpu" (trimSuffix "/" .Values.dp.hostHookPath) | quote }}
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_HOOK_PATH
              value: {{ .Values.dp.hostHookPath | quote }}
            - name: OPERATING_MODE
              value: {{ .Values.dp.operatingMode | quote }}
            - name: COMPUTE_PARTITION
              value: {{ .Values.dp.computePartition | quote }}
          securityContext:
            {{- toYaml .Values.dp.securityContext | nindent 12 }}
          volumeMounts:
            - name: dp
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
            - name: health
              mountPath: /var/lib/amd-metrics-exporter/
            {{- if .Values.dp.cdi.enabled }}
            - name: cdi
              mountPath: {{ .Values.dp.cdi.specDir | quote }}
            {{- end }}
            {{- if .Values.dp.hookInstaller.enabled }}
            - name: host-vgpu-hook
              mountPath: {{ printf "%s/vgpu" (trimSuffix "/" .Values.dp.hostHookPath) | quote }}
            {{- end }}
            {{- if .Values.dp.muslFailClosed.enabled }}
            - name: ctr-bin
              mountPath: /opt/amd-gpu-ctr-host/ctr
              readOnly: true
            - name: containerd-sock
              mountPath: {{ .Values.dp.muslFailClosed.containerdSocketDir | quote }}
              mountPropagation: HostToContainer
            - name: containerd-data
              mountPath: {{ .Values.dp.muslFailClosed.containerdDataDir | quote }}
              mountPropagation: HostToContainer
            {{- end }}
          resources:
            {{- toYaml .Values.dp.resources | nindent 12 }}
      volumes:
        {{- if .Values.dp.cdi.enabled }}
        - name: cdi
          hostPath:
            path: {{ .Values.dp.cdi.specDir | quote }}
            type: DirectoryOrCreate
        {{- end }}
        - name: dp
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sys
          hostPath:
            path: /sys
        - name: health
          hostPath:
            path: /var/lib/amd-metrics-exporter/
            type: DirectoryOrCreate
        {{- if .Values.dp.hookInstaller.enabled }}
        - name: host-vgpu-hook
          hostPath:
            path: {{ printf "%s/vgpu" (trimSuffix "/" .Values.dp.hostHookPath) | quote }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.dp.muslFailClosed.enabled }}
        - name: ctr-bin
          hostPath:
            path: {{ .Values.dp.muslFailClosed.ctrPath | quote }}
            type: File
        - name: containerd-sock
          hostPath:
            path: {{ .Values.dp.muslFailClosed.containerdSocketDir | quote }}
            type: Directory
        - name: containerd-data
          hostPath:
            path: {{ .Values.dp.muslFailClosed.containerdDataDir | quote }}
            type: Directory
        {{- end }}
