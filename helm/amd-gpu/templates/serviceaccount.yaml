{{- if .Values.dp.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "amd-gpu.devicePluginServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amd-gpu.labels" . | nindent 4 }}
  {{- with .Values.dp.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
