dp:
  image:
    repository: ghcr.io/project-hami/amd-device-plugin
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # The plugin queries host GPU devices and passes them to workloads.
  securityContext:
    privileged: true
    capabilities:
      drop:
        - ALL
  # Host path prefix for vGPU hook files on host.
  # The HAMi-style postStart installer creates
  # <hostHookPath>/vgpu/libamvgpu.so on the host.
  # Workload container path is fixed in plugin code: /usr/local/vgpu/libamvgpu.so
  hostHookPath: "/usr/local"
  # glog verbosity (-v). 4 adds topology parsing, 5 adds annotation decoding.
  logVerbosity: 2
  # Seconds between per-GPU health checks; 0 disables them.
  healthPulse: 10
  # How many workloads may share one GPU. 0 picks it per GPU: 2 on gfx12
  # (RDNA4), where more sharers contend for compute queues (see the README),
  # otherwise 10.
  splitCount: 0
  # Preferred allocation policy for multi-GPU requests: besteffort, binpack or spread.
  allocatorPolicy: besteffort
  # Also cap sliced allocations through the kernel dmem cgroup controller, a
  # hard driver-level VRAM limit independent of libamvgpu. Used only when the
  # node has the dmem controller and the systemd cgroup driver; otherwise
  # skipped with one log line. See Project-HAMi/amd-hami-core#10.
  dmemBackend: true
  # Experimental: refuse a sliced allocation whose container image is not
  # LD_AUDIT-compatible (musl/Alpine, statically linked, or glibc older than
  # 2.34) unless dmem caps it. See Project-HAMi/amd-hami-core#3.
  # Requires the containerd socket and its snapshotter data directory
  # mounted with mountPropagation: HostToContainer, so this pod's mount
  # namespace can see the read-only image mount "ctr images mount" makes;
  # verified on RKE2 (paths below are RKE2's defaults, override for other
  # distros).
  muslFailClosed:
    enabled: false
    ctrPath: /var/lib/rancher/rke2/bin/ctr
    containerdSocketDir: /run/k3s/containerd
    containerdSocket: /run/k3s/containerd/containerd.sock
    containerdDataDir: /var/lib/rancher/rke2/agent/containerd
  # Inject GPUs through CDI instead of device nodes. The plugin writes an
  # amd.com/gpu spec to specDir on the host; the container runtime must have
  # CDI enabled and read that directory (containerd 2.x and CRI-O do by default).
  cdi:
    enabled: false
    specDir: /var/run/cdi
  # Copy the libamvgpu.so hook built from amd-hami-core from the device-plugin
  # image to the mounted hostPath.
  hookInstaller:
    enabled: true
  resources: {}
  # Set daemonsets updateStrategy for device plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

# Per-container VRAM and host GPU metrics of the node, as Prometheus metrics
# under the metric names of the HAMi NVIDIA vGPUmonitor. It reads the dmem
# cgroup controller and sysfs, so it needs the systemd cgroup driver on a
# kernel with the dmem controller, and no ROCm tooling.
monitor:
  enabled: false
  metricsBindAddress: ":9394"
  resources: {}

imagePullSecrets: []

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

node_selector_enabled: false
node_selector:
  feature.node.kubernetes.io/pci-0300_1002.present: "true"
  kubernetes.io/arch: amd64
