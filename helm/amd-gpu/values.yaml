nfd:
  enabled: false

labeller:
  enabled: false

dp:
  image:
    repository: ghcr.io/project-hami/amd-device-plugin
    # Overrides the image tag whose default is the chart appVersion.
    tag: "main"
    pullPolicy: IfNotPresent
  # Host path prefix for vGPU hook files on host.
  # The HAMi-style postStart installer creates
  # <hostHookPath>/vgpu/libamvgpu.so on the host.
  # Workload container path is fixed in plugin code: /usr/local/vgpu/libamvgpu.so
  hostHookPath: "/usr/local"
  # Temporary: copy the checked-in libamvgpu.so from the device-plugin image
  # to the mounted hostPath. The artifact will come from amd-hami-core later.
  hookInstaller:
    enabled: true
  resources: {}
  # Set daemonsets updateStrategy for device plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

lbl:
  image:
    repository: docker.io/rocm/k8s-device-plugin
    tag: "labeller-1.31.0.9"
  serviceAccount:
    annotations: {}
  securityContext:
    privileged: true # Needed for /dev
    capabilities:
      drop:
        - ALL
      add:
        - CAP_SYS_ADMIN
    readOnlyRootFilesystem: false # true if -logtostderr flag set in labeller
  # If you do want to specify resources, uncomment the following lines, 
  # adjust them as necessary, and remove the curly braces after 'resources:'.
  resources: {}
    # limits:
    #   memory: 20Mi
    #   cpu: 100m
    # requests:
    #   memory: 30Mi
    #   cpu: 150m
  # Set daemonsets updateStrategy for labeller
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

imagePullSecrets: []

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

node_selector_enabled: false
node_selector:
  feature.node.kubernetes.io/pci-0300_1002.present: "true"
  kubernetes.io/arch: amd64
