dp:
  image:
    repository: ghcr.io/fishman/amd-device-plugin
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.0.17"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # The plugin queries host GPU devices and passes them to workloads.
  # "cu" registers whole GPUs as soft devices sliced by CU (default);
  # "partition" registers hard compute partitions (id#mode, Count 1).
  # A node annotation hami.io/amd-operating-mode: cu|partition overrides
  # this per node.
  operatingMode: "cu"
  # Target compute partition type (spx/dpx/qpx/cpx) the plugin applies to
  # every GPU via the AMD SMI API at startup, only when operatingMode is
  # "partition". Empty leaves the hardware mode untouched. A node annotation
  # hami.io/amd-compute-partition overrides this per node.
  computePartition: ""
  securityContext:
    privileged: true
    capabilities:
      drop:
        - ALL
  # Host path prefix for vGPU hook files on host.
  # The HAMi-style postStart installer creates
  # <hostHookPath>/vgpu/libamvgpu.so on the host.
  # Workload container path is fixed in plugin code: /usr/local/vgpu/libamvgpu.so
  hostHookPath: "/usr/local"
  # Temporary: copy the checked-in libamvgpu.so from the device-plugin image
  # to the mounted hostPath. The artifact will come from amd-hami-core later.
  hookInstaller:
    enabled: true
  resources: {}
  # Set daemonsets updateStrategy for device plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

imagePullSecrets:
  - name: ghcr-fishman

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

node_selector_enabled: false
node_selector:
  feature.node.kubernetes.io/pci-0300_1002.present: "true"
  kubernetes.io/arch: amd64
